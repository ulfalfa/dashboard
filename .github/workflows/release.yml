name: Release

# Manual: Actions -> Release -> Run workflow. The version is derived from the Conventional Commits since the last tag;
# enter a version like 1.2.0 only to override it
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version override (e.g. 1.2.0); empty = derived from commits
        required: false
        type: string

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Validate secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [ -n "${!name}" ] || { echo "::error::Repository secret $name is missing - see README, section Release"; exit 1; }
          done
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git-cliff needs the full history
      - name: Compute version from commits
        id: bump
        if: inputs.version == ''
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --bumped-version
      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          BUMPED_VERSION: ${{ steps.bump.outputs.content }}
        run: |
          bumped="$(echo "$BUMPED_VERSION" | tr -d '[:space:]')"
          version="${INPUT_VERSION:-${bumped#v}}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version '$version' must look like 1.2.0"; exit 1; }
          if [ -z "$INPUT_VERSION" ]; then
            last_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
            changes="$(git rev-list --count "$last_tag..HEAD" --invert-grep --grep='^chore(release)')"
            [ "$changes" -gt 0 ] || { echo "::error::No commits since $last_tag - merge a feat/fix first or enter a version"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Fail if tag exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists - choose a higher version"; exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Test and build signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease -PversionName="$VERSION" -PversionCode="$GITHUB_RUN_NUMBER"
      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --tag v${{ env.VERSION }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
      - name: Generate full changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --tag v${{ env.VERSION }}
        env:
          OUTPUT: CHANGELOG.md
      - name: Commit changelog to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): v$VERSION"
          git push origin HEAD:main || { echo "::error::Push to main failed (branch protection or main moved) - allow github-actions to push or re-run"; exit 1; }
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "dashboard-$VERSION.apk"
          gh release create "v$VERSION" "dashboard-$VERSION.apk" --target "$(git rev-parse HEAD)" --title "v$VERSION" --notes-file RELEASE_NOTES.md
