<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Settings</title>
<style>
  :root {
    --bg: #eef1f6; --surface: #ffffff; --surface-2: #f5f7fb; --fg: #19202e; --muted: #667085;
    --line: #dbe0ea; --accent: #2f6bff; --accent-fg: #ffffff; --accent-soft: #e6edff;
    --bad: #c62828; --bad-soft: #fdecea; --ok: #1b7f3b; --ok-soft: #e6f5ea; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 8px 24px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1218; --surface: #181d27; --surface-2: #11151d; --fg: #e8ecf3; --muted: #93a0b5;
      --line: #2a3242; --accent: #6b9bff; --accent-fg: #0b1220; --accent-soft: #1d2a47;
      --bad: #ff8a80; --bad-soft: #3a1d1d; --ok: #62d583; --ok-soft: #14301f; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 96px; }

  header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .logo { width: 44px; height: 44px; border-radius: 12px; background: var(--accent); color: var(--accent-fg);
          display: grid; place-items: center; flex: none; }
  .logo svg { width: 24px; height: 24px; }
  h1 { font-size: 22px; line-height: 1.2; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
               padding: 14px 16px; border-bottom: 1px solid var(--line); }
  .card-head h2 { margin: 0; font-size: 15px; }
  .pill { font-size: 13px; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line);
          border-radius: 999px; padding: 3px 10px; }

  #rows { list-style: none; margin: 0; padding: 8px; display: grid; gap: 8px; }
  .row { display: grid; grid-template-columns: 32px minmax(0, 1fr) 120px 120px auto; gap: 10px; align-items: end;
         padding: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; }
  .idx { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; align-self: center;
         background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 14px; }
  label { display: grid; gap: 4px; min-width: 0; font-size: 12px; font-weight: 600; color: var(--muted); }
  .field { position: relative; display: block; }
  .field input { padding-right: 34px; }
  .unit { position: absolute; right: 10px; bottom: 8px; color: var(--muted); font-size: 13px; pointer-events: none; }
  input { width: 100%; height: 38px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px;
          background: var(--surface); color: var(--fg); font: inherit; }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  input.invalid { border-color: var(--bad); background: var(--bad-soft); }
  .tools { display: flex; gap: 4px; align-self: end; }

  button { height: 38px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
           color: var(--fg); font: inherit; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  button:hover { background: var(--surface-2); }
  button.icon { width: 38px; padding: 0; justify-content: center; }
  button.icon.danger:hover { color: var(--bad); border-color: var(--bad); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .5; cursor: default; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }

  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px; background: var(--surface);
         border-top: 1px solid var(--line); }
  .bar-inner { max-width: 980px; margin: 0 auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  #msg { margin-left: auto; font-size: 14px; padding: 6px 12px; border-radius: 8px; display: none; }
  #msg.err { display: block; color: var(--bad); background: var(--bad-soft); }
  #msg.ok { display: block; color: var(--ok); background: var(--ok-soft); }
  #msg.busy { display: block; color: var(--muted); }

  @media (max-width: 720px) {
    .row { grid-template-columns: 32px minmax(0, 1fr) minmax(0, 1fr); }
    .row .url { grid-column: 2 / -1; }
    .row .dur { grid-column: 2; }
    .row .zm { grid-column: 3; }
    .row .tools { grid-column: 1 / -1; justify-content: flex-end; }
    #msg { margin-left: 0; width: 100%; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    </div>
    <div>
      <h1>Dashboard Settings</h1>
      <p>Seiten, Anzeigedauer und Zoom – Änderungen gelten sofort nach dem Speichern.</p>
    </div>
  </header>

  <section class="card" aria-labelledby="pages-title">
    <div class="card-head">
      <h2 id="pages-title">Rotation</h2>
      <span class="pill" id="summary"></span>
    </div>
    <ol id="rows"></ol>
    <div class="empty" id="empty" hidden>Noch keine Seite – füge unten eine hinzu.</div>
  </section>
</main>

<div class="bar">
  <div class="bar-inner">
    <button id="add" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Seite hinzufügen
    </button>
    <button id="save" type="button" class="primary">Speichern &amp; anwenden</button>
    <span id="msg" role="status" aria-live="polite"></span>
  </div>
</div>

<script>
const rows = document.getElementById('rows');
const msg = document.getElementById('msg');
const summary = document.getElementById('summary');
const empty = document.getElementById('empty');
const saveBtn = document.getElementById('save');

const ICON = {
  up: '<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  down: '<svg viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>',
  del: '<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
};

function say(text, cls) { msg.textContent = text; msg.className = cls; }

function refresh() {
  const items = [...rows.children];
  items.forEach((li, i) => {
    li.querySelector('.idx').textContent = i + 1;
    li.querySelector('[data-act=up]').disabled = i === 0;
    li.querySelector('[data-act=down]').disabled = i === items.length - 1;
  });
  const total = items.reduce((sum, li) => sum + (Number(li.querySelector('.seconds').value) || 0), 0);
  summary.textContent = `${items.length} ${items.length === 1 ? 'Seite' : 'Seiten'} · ${total} s pro Durchlauf`;
  empty.hidden = items.length > 0;
}

function addRow(page) {
  const li = document.createElement('li');
  li.className = 'row';
  li.innerHTML = `
    <span class="idx" aria-hidden="true"></span>
    <label class="url">URL
      <input class="url-input" type="url" placeholder="https://…" inputmode="url" autocomplete="off" spellcheck="false">
    </label>
    <label class="dur">Dauer
      <span class="field"><input class="seconds" type="number" min="1" step="1" inputmode="numeric"><span class="unit">s</span></span>
    </label>
    <label class="zm">Zoom
      <span class="field"><input class="zoom" type="number" min="10" max="500" step="5" inputmode="numeric"><span class="unit">%</span></span>
    </label>
    <div class="tools">
      <button type="button" class="icon" data-act="up" aria-label="Nach oben">${ICON.up}</button>
      <button type="button" class="icon" data-act="down" aria-label="Nach unten">${ICON.down}</button>
      <button type="button" class="icon danger" data-act="del" aria-label="Seite löschen">${ICON.del}</button>
    </div>`;
  li.querySelector('.url-input').value = page.url;
  li.querySelector('.seconds').value = page.seconds;
  li.querySelector('.zoom').value = page.zoom;
  rows.appendChild(li);
}

rows.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  const li = e.target.closest('li');
  if (!btn || !li) return;
  const act = btn.dataset.act;
  if (act === 'del') li.remove();
  if (act === 'up' && li.previousElementSibling) rows.insertBefore(li, li.previousElementSibling);
  if (act === 'down' && li.nextElementSibling) rows.insertBefore(li.nextElementSibling, li);
  refresh();
});
rows.addEventListener('input', (e) => { e.target.classList.remove('invalid'); refresh(); });

document.getElementById('add').addEventListener('click', () => {
  addRow({ url: '', seconds: 30, zoom: 100 });
  refresh();
  rows.lastElementChild.querySelector('.url-input').focus();
});

function collect() {
  return { pages: [...rows.children].map((li) => ({
    url: li.querySelector('.url-input').value.trim(),
    seconds: Number(li.querySelector('.seconds').value),
    zoom: Number(li.querySelector('.zoom').value),
  })) };
}

// Mirrors the server-side rules so mistakes are marked per field; the server still validates.
function markInvalid() {
  let first = null;
  [...rows.children].forEach((li) => {
    const checks = [
      [li.querySelector('.url-input'), (v) => /^https?:\/\//.test(v)],
      [li.querySelector('.seconds'), (v) => Number.isInteger(Number(v)) && Number(v) >= 1],
      [li.querySelector('.zoom'), (v) => Number.isInteger(Number(v)) && Number(v) >= 10 && Number(v) <= 500],
    ];
    checks.forEach(([input, ok]) => {
      const bad = !ok(input.value.trim());
      input.classList.toggle('invalid', bad);
      if (bad && !first) first = input;
    });
  });
  if (first) first.focus();
  return first === null;
}

async function load() {
  const res = await fetch('/api/pages');
  const data = await res.json();
  if (!res.ok) throw new Error(data.error);
  rows.innerHTML = '';
  data.pages.forEach(addRow);
  refresh();
}

saveBtn.addEventListener('click', async () => {
  if (!rows.children.length) { say('Mindestens eine Seite wird benötigt.', 'err'); return; }
  if (!markInvalid()) { say('Bitte die markierten Felder korrigieren (URL mit http(s)://, Dauer ≥ 1, Zoom 10–500).', 'err'); return; }
  saveBtn.disabled = true;
  say('Speichere …', 'busy');
  try {
    const res = await fetch('/api/pages', { method: 'PUT', body: JSON.stringify(collect()) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);
    say('Gespeichert – Rotation neu gestartet.', 'ok');
  } catch (e) {
    say('Fehler: ' + e.message, 'err');
  } finally {
    saveBtn.disabled = false;
  }
});

load().catch((e) => say('Laden fehlgeschlagen: ' + e.message, 'err'));
</script>
</body>
</html>
